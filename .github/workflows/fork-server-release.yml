name: Fork server release

# Fork-only (atlitech/t3code). Builds the self-contained Linux x64 server
# archive the official release ships and, from the same commit, the unsigned
# Mac arm64 desktop DMG and the personal Android arm64-v8a APK, and publishes
# all three with SHA256SUMS and manifest.json as a prerelease, in the layout
# scripts/install.sh and `t3 update` download from. A release publishes only
# when all three build. Before anything publishes,
# the admission job installs that exact archive over data the previously
# admitted release wrote, upgrades and runs it, and the release ships its
# attested ADMISSION.json only when every check passed. Releases are
# immutable: the guard refuses a used version, and publish creates the tag and
# the release with every asset at once.
# Runbook: docs/operations/fork-server.md.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Fork version, <next upstream patch>-atli.<n> (for example 0.0.46-atli.1)"
        required: true
        type: string
      admission-bootstrap-prior:
        description: "First admission only: the earlier release (for example 0.0.46-atli.3) to upgrade from while no release carries ADMISSION.json. Leave empty otherwise."
        required: false
        default: ""
        type: string

concurrency:
  group: fork-server-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # Runs before every build: the dispatch must come from atli, the version
  # must be unused, and the atli tip must have passed CI's Check job. Every
  # later job checks out the commit this job approved, not the moving branch.
  guard:
    name: Guard release
    if: github.repository == 'atlitech/t3code'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      checks: read
    outputs:
      sha: ${{ steps.guard.outputs.sha }}
      version: ${{ steps.guard.outputs.version }}
      tag: ${{ steps.guard.outputs.tag }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Require repository variables
        shell: bash
        env:
          T3CODE_CLERK_PUBLISHABLE_KEY: ${{ vars.T3CODE_CLERK_PUBLISHABLE_KEY }}
          T3CODE_CLERK_JWT_TEMPLATE: ${{ vars.T3CODE_CLERK_JWT_TEMPLATE }}
          T3CODE_CLERK_CLI_OAUTH_CLIENT_ID: ${{ vars.T3CODE_CLERK_CLI_OAUTH_CLIENT_ID }}
          T3CODE_RELAY_URL: ${{ vars.T3CODE_RELAY_URL }}
        run: |
          set -euo pipefail
          missing=()
          for name in T3CODE_CLERK_PUBLISHABLE_KEY T3CODE_CLERK_JWT_TEMPLATE T3CODE_CLERK_CLI_OAUTH_CLIENT_ID T3CODE_RELAY_URL; do
            [[ -n "${!name:-}" ]] || missing+=("$name")
          done
          if (( ${#missing[@]} > 0 )); then
            echo "::error::Missing repository variables: ${missing[*]}"
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb # v1
        with:
          node-version-file: package.json
          cache: true
          run-install: |
            args:
              - --filter=@t3tools/scripts...

      - name: Check ref, version, and CI
        id: guard
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: node scripts/fork-release-guard.ts --release-version "$RELEASE_VERSION"

  build-linux:
    name: Build Linux x64 server
    needs: guard
    if: github.repository == 'atlitech/t3code'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write
      attestations: write
    outputs:
      archive-sha256: ${{ steps.digest.outputs.sha256 }}
    env:
      # Public T3 Connect identifiers baked into the server and web bundles.
      T3CODE_CLERK_PUBLISHABLE_KEY: ${{ vars.T3CODE_CLERK_PUBLISHABLE_KEY }}
      T3CODE_CLERK_JWT_TEMPLATE: ${{ vars.T3CODE_CLERK_JWT_TEMPLATE }}
      T3CODE_CLERK_CLI_OAUTH_CLIENT_ID: ${{ vars.T3CODE_CLERK_CLI_OAUTH_CLIENT_ID }}
      T3CODE_RELAY_URL: ${{ vars.T3CODE_RELAY_URL }}
      VERSION: ${{ needs.guard.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.guard.outputs.sha }}
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb # v1
        with:
          node-version-file: package.json
          cache: true
          run-install: false

      - name: Install dependencies
        run: vp install --filter=t3... --filter=@t3tools/web... --filter=@t3tools/scripts...

      - name: Align package versions to release version
        run: node scripts/update-release-package-versions.ts "$VERSION"

      - name: Cache resource monitor
        id: resource_monitor_cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: native/resource-monitor/target/x86_64-unknown-linux-gnu/release/t3-resource-monitor
          key: resource-monitor-x86_64-unknown-linux-gnu-${{ hashFiles('native/resource-monitor/Cargo.lock', 'native/resource-monitor/Cargo.toml', 'native/resource-monitor/src/**') }}

      - name: Setup Rust
        if: steps.resource_monitor_cache.outputs.cache-hit != 'true'
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
          targets: x86_64-unknown-linux-gnu

      - name: Build resource monitor
        if: steps.resource_monitor_cache.outputs.cache-hit != 'true'
        run: cargo build --locked --release --manifest-path native/resource-monitor/Cargo.toml --target x86_64-unknown-linux-gnu

      # t3#build builds @t3tools/web first and copies it into apps/server/dist/client.
      - name: Build server and web client
        run: vp run --filter t3 build

      - name: Build CLI single-executable
        env:
          # Keep in step with SEA_NODE_VERSION in apps/server/vite.config.ts.
          VP_NODE_VERSION: "26.8.2"
        run: node apps/server/scripts/cli.ts build-exe --verbose

      - name: Build and smoke-test CLI archive
        shell: bash
        run: |
          set -euo pipefail
          monitor_dir="$RUNNER_TEMP/cli-resource-monitor"
          mkdir -p "$monitor_dir/linux-x64"
          cp native/resource-monitor/target/x86_64-unknown-linux-gnu/release/t3-resource-monitor "$monitor_dir/linux-x64/"
          node scripts/build-cli-archive.ts \
            --platform linux \
            --arch x64 \
            --version "$VERSION" \
            --resource-monitor-dir "$monitor_dir" \
            --output-dir release-cli
          node scripts/smoke-cli-archive.ts --archive "release-cli/t3-$VERSION-linux-x64.tar.gz" --expect-version "$VERSION"

      # admission refuses any archive whose sha256 is not this one.
      - name: Record archive digest
        id: digest
        shell: bash
        run: |
          set -euo pipefail
          sha256="$(sha256sum "release-cli/t3-$VERSION-linux-x64.tar.gz" | cut -d ' ' -f 1)"
          echo "sha256=$sha256" >> "$GITHUB_OUTPUT"

      - name: Attest archive provenance
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: release-cli/t3-${{ needs.guard.outputs.version }}-linux-x64.tar.gz

      # publish downloads every `release-*` artifact into one directory.
      - name: Upload archive
        uses: actions/upload-artifact@v7
        with:
          name: release-linux-x64
          path: release-cli/t3-${{ needs.guard.outputs.version }}-linux-x64.tar.gz
          if-no-files-found: error
          retention-days: 7

  # Builds the desktop DMG unsigned, on a GitHub-hosted Apple silicon runner,
  # with no Apple secrets: the owner signs the installed app ad hoc. Checked
  # only for its identity, never run here.
  build-mac:
    name: Build Mac arm64 desktop app
    needs: guard
    if: github.repository == 'atlitech/t3code'
    runs-on: macos-15
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write
      attestations: write
    env:
      # Public T3 Connect identifiers baked into the desktop, server, and web bundles.
      T3CODE_CLERK_PUBLISHABLE_KEY: ${{ vars.T3CODE_CLERK_PUBLISHABLE_KEY }}
      T3CODE_CLERK_JWT_TEMPLATE: ${{ vars.T3CODE_CLERK_JWT_TEMPLATE }}
      T3CODE_CLERK_CLI_OAUTH_CLIENT_ID: ${{ vars.T3CODE_CLERK_CLI_OAUTH_CLIENT_ID }}
      T3CODE_RELAY_URL: ${{ vars.T3CODE_RELAY_URL }}
      T3CODE_DESKTOP_VERSION: ${{ needs.guard.outputs.version }}
      VERSION: ${{ needs.guard.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.guard.outputs.sha }}
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb # v1
        with:
          node-version-file: package.json
          cache: true
          run-install: false

      - name: Install dependencies
        run: vp install --filter=t3... --filter=@t3tools/web... --filter=@t3tools/desktop... --filter=@t3tools/scripts...

      - name: Align package versions to release version
        run: node scripts/update-release-package-versions.ts "$VERSION"

      # The desktop build compiles the bundled resource monitor from source.
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
          targets: aarch64-apple-darwin

      # Builds unsigned by default and writes release/T3-Code-<version>-arm64.dmg.
      # Without GITHUB_REPOSITORY the build configures no update feed, as a
      # local build does: fork releases carry no desktop updater metadata.
      - name: Build desktop DMG
        run: env -u GITHUB_REPOSITORY -u T3CODE_DESKTOP_UPDATE_REPOSITORY vp run dist:desktop:dmg:arm64

      - name: Check the app's bundle identifier, version, and signature
        shell: bash
        run: |
          set -euo pipefail
          mount_dir="$RUNNER_TEMP/dmg"
          mkdir -p "$mount_dir"
          hdiutil attach "release/T3-Code-$VERSION-arm64.dmg" -nobrowse -readonly -mountpoint "$mount_dir"
          trap 'hdiutil detach "$mount_dir"' EXIT
          shopt -s nullglob
          apps=("$mount_dir"/*.app)
          if (( ${#apps[@]} != 1 )); then
            echo "::error::Expected one app in the DMG; found ${#apps[@]}."
            exit 1
          fi
          if [[ -e "${apps[0]}/Contents/Resources/app-update.yml" ]]; then
            echo "::error::The app carries an update feed (app-update.yml); fork releases publish no updater metadata."
            exit 1
          fi
          plutil -convert xml1 -o - "${apps[0]}/Contents/Info.plist" > "$RUNNER_TEMP/Info.plist"
          codesign -dv --verbose=2 "${apps[0]}" > "$RUNNER_TEMP/codesign.txt" 2>&1 || true
          node scripts/fork-mac-identity.ts \
            --info-plist "$RUNNER_TEMP/Info.plist" \
            --codesign "$RUNNER_TEMP/codesign.txt" \
            --release-version "$VERSION"

      - name: Attest DMG provenance
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: release/T3-Code-${{ needs.guard.outputs.version }}-arm64.dmg

      # publish downloads every `release-*` artifact into one directory.
      - name: Upload DMG
        uses: actions/upload-artifact@v7
        with:
          name: release-darwin-arm64
          path: release/T3-Code-${{ needs.guard.outputs.version }}-arm64.dmg
          if-no-files-found: error
          retention-days: 7

  # Builds the personal Android APK (com.elvis.t3code) for arm64-v8a, signed
  # with the owner's key from the personal-android-signing environment, which
  # only atli may deploy to. The keystore and google-services.json are written
  # under RUNNER_TEMP and never printed. Native Google sign-in and push turn on
  # only when their values are set. Checked for its package, certificate, and
  # versionCode, never run here.
  build-android:
    name: Build personal Android arm64-v8a APK
    needs: guard
    if: github.repository == 'atlitech/t3code' && github.ref == 'refs/heads/atli'
    runs-on: ubuntu-24.04
    environment: personal-android-signing
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write
      attestations: write
    env:
      # Public T3 Connect identifiers baked into the app bundle.
      T3CODE_CLERK_PUBLISHABLE_KEY: ${{ vars.T3CODE_CLERK_PUBLISHABLE_KEY }}
      T3CODE_CLERK_JWT_TEMPLATE: ${{ vars.T3CODE_CLERK_JWT_TEMPLATE }}
      T3CODE_CLERK_CLI_OAUTH_CLIENT_ID: ${{ vars.T3CODE_CLERK_CLI_OAUTH_CLIENT_ID }}
      T3CODE_RELAY_URL: ${{ vars.T3CODE_RELAY_URL }}
      APP_VARIANT: personal
      # app.config.ts derives android.versionCode from it.
      T3CODE_RELEASE_VERSION: ${{ needs.guard.outputs.version }}
      VERSION: ${{ needs.guard.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.guard.outputs.sha }}
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb # v1
        with:
          node-version-file: package.json
          cache: true
          run-install: false

      - name: Install dependencies
        run: vp install --filter=@t3tools/mobile... --filter=@t3tools/scripts...

      # As the mobile workflows do, for tools that call the workspace's pnpm.
      - name: Expose pnpm
        run: |
          pnpm_version="$(node --print "require('./package.json').packageManager.split('@').pop()")"
          vp_pnpm_bin="$HOME/.vite-plus/package_manager/pnpm/$pnpm_version/pnpm/bin"
          echo "$vp_pnpm_bin" >> "$GITHUB_PATH"
          "$vp_pnpm_bin/pnpm" --version

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Write signing keystore
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.T3CODE_PERSONAL_ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::The personal-android-signing environment has no T3CODE_PERSONAL_ANDROID_KEYSTORE_BASE64 secret."
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/t3-code-personal.jks"
          echo "T3CODE_PERSONAL_ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/t3-code-personal.jks" >> "$GITHUB_ENV"

      - name: Enable native Google sign-in
        if: vars.T3CODE_CLERK_GOOGLE_ANDROID_CLIENT_ID != ''
        shell: bash
        env:
          GOOGLE_ANDROID_CLIENT_ID: ${{ vars.T3CODE_CLERK_GOOGLE_ANDROID_CLIENT_ID }}
        run: echo "EXPO_PUBLIC_CLERK_GOOGLE_ANDROID_CLIENT_ID=$GOOGLE_ANDROID_CLIENT_ID" >> "$GITHUB_ENV"

      # The secrets context is unavailable to a step's `if:`, so the shell
      # checks the value.
      - name: Write google-services.json
        shell: bash
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          set -euo pipefail
          if [ -n "$GOOGLE_SERVICES_JSON_BASE64" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON_BASE64" | base64 -d > "$RUNNER_TEMP/google-services.json"
            echo "T3CODE_ANDROID_GOOGLE_SERVICES_FILE=$RUNNER_TEMP/google-services.json" >> "$GITHUB_ENV"
          fi

      - name: Check public config
        shell: bash
        run: |
          set -euo pipefail
          (cd apps/mobile && vp exec expo config --type public --json) > "$RUNNER_TEMP/expo-config.json"
          node scripts/fork-android-config.ts --config "$RUNNER_TEMP/expo-config.json"

      - name: Generate the Android project
        run: cd apps/mobile && EXPO_NO_GIT_STATUS=1 vp exec expo prebuild --clean --platform android --no-install

      - name: Build signed release APK
        env:
          T3CODE_PERSONAL_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.T3CODE_PERSONAL_ANDROID_KEYSTORE_PASSWORD }}
          T3CODE_PERSONAL_ANDROID_KEY_PASSWORD: ${{ secrets.T3CODE_PERSONAL_ANDROID_KEY_PASSWORD }}
          T3CODE_PERSONAL_ANDROID_KEY_ALIAS: ${{ vars.T3CODE_PERSONAL_ANDROID_KEY_ALIAS }}
        run: cd apps/mobile/android && ./gradlew :app:assembleRelease -PreactNativeArchitectures=arm64-v8a

      - name: Name the APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release
          cp apps/mobile/android/app/build/outputs/apk/release/app-release.apk "release/T3-Code-$VERSION-android-arm64-v8a.apk"

      - name: Check APK identity
        shell: bash
        run: |
          set -euo pipefail
          apk="release/T3-Code-$VERSION-android-arm64-v8a.apk"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$apk" > "$RUNNER_TEMP/badging.txt"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs "$apk" > "$RUNNER_TEMP/certs.txt"
          node scripts/fork-android-identity.ts \
            --badging "$RUNNER_TEMP/badging.txt" \
            --certs "$RUNNER_TEMP/certs.txt" \
            --release-version "$VERSION"

      - name: Attest APK provenance
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: release/T3-Code-${{ needs.guard.outputs.version }}-android-arm64-v8a.apk

      # publish downloads every `release-*` artifact into one directory.
      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: release-android-arm64-v8a
          path: release/T3-Code-${{ needs.guard.outputs.version }}-android-arm64-v8a.apk
          if-no-files-found: error
          retention-days: 7

  # Installs the built archive over a T3 home the prior release migrated and
  # seeded, upgrades and runs it, and reads the seeded threads back through the
  # candidate. Writes ADMISSION.json only when every check passed, so a failed
  # admission publishes nothing. Verifiers: scripts/linux-admission/.
  admission:
    name: Admit Linux server upgrade
    needs: [guard, build-linux]
    if: github.repository == 'atlitech/t3code'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      VERSION: ${{ needs.guard.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.guard.outputs.sha }}
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb # v1
        with:
          node-version-file: package.json
          cache: true
          run-install: |
            args:
              - --filter=@t3tools/scripts...

      - name: Install sqlite3
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v sqlite3 >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y sqlite3
          fi
          sqlite3 --version

      - name: Download archive
        uses: actions/download-artifact@v8
        with:
          name: release-linux-x64
          path: ${{ runner.temp }}/candidate

      - name: Choose the release to upgrade from
        id: prior
        env:
          BOOTSTRAP: ${{ inputs.admission-bootstrap-prior }}
        run: node scripts/linux-admission/prior-release.ts --repo "$GH_REPO" --release-version "$VERSION" --bootstrap "$BOOTSTRAP"

      - name: Upgrade from the prior release and check the candidate
        env:
          CANDIDATE_ARCHIVE: ${{ runner.temp }}/candidate/t3-${{ needs.guard.outputs.version }}-linux-x64.tar.gz
          EXPECTED_SHA256: ${{ needs.build-linux.outputs.archive-sha256 }}
          RELEASE_VERSION: ${{ needs.guard.outputs.version }}
          PRIOR_VERSION: ${{ steps.prior.outputs.version }}
          PRIOR_SOURCE: ${{ steps.prior.outputs.source }}
          VERIFIER_COMMIT: ${{ needs.guard.outputs.sha }}
          WORKDIR: ${{ runner.temp }}/admission
          OUT_DIR: ${{ runner.temp }}/admission-record
        run: bash scripts/linux-admission/run-admission.sh

      # Not a `release-*` artifact: publish adds it after the manifest step,
      # which accepts only the server archive, the DMG, and the APK.
      - name: Upload admission record
        uses: actions/upload-artifact@v7
        with:
          name: admission
          path: ${{ runner.temp }}/admission-record/ADMISSION.json
          if-no-files-found: error
          retention-days: 7

  # Creates the tag and the release together, with every asset in one call, so
  # a published release never changes. A failed run is retried by dispatching
  # the next version, never by re-running this job against a used one.
  publish:
    name: Publish release
    needs: [guard, build-linux, admission, build-mac, build-android]
    if: github.repository == 'atlitech/t3code'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      SHA: ${{ needs.guard.outputs.sha }}
      VERSION: ${{ needs.guard.outputs.version }}
      TAG: ${{ needs.guard.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.guard.outputs.sha }}
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb # v1
        with:
          node-version-file: package.json
          cache: true
          run-install: |
            args:
              - --filter=@t3tools/scripts...

      - name: Download archive, DMG, and APK
        uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: release
          merge-multiple: true

      - name: Write SHA256SUMS and manifest.json
        run: |
          node scripts/fork-release-manifest.ts --dir release --commit "$SHA" --release-version "$VERSION"
          cat release/SHA256SUMS release/manifest.json

      - name: Download admission record
        uses: actions/download-artifact@v8
        with:
          name: admission
          path: release

      - name: Attest SHA256SUMS, manifest.json, and ADMISSION.json provenance
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: |
            release/SHA256SUMS
            release/manifest.json
            release/ADMISSION.json

      # Tags created with GITHUB_TOKEN start no other workflows.
      - name: Create tag and release
        shell: bash
        run: |
          set -euo pipefail
          gh release create "$TAG" release/* \
            --target "$SHA" \
            --prerelease \
            --title "T3 Code $VERSION (atli fork, Linux x64 server, Mac arm64 app, and Android APK)" \
            --notes "Linux x64 server, unsigned Mac arm64 desktop app, and personal Android arm64-v8a APK built from $GH_REPO@$SHA. Install them with docs/operations/fork-server.md."
